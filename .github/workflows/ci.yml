name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x64:
    name: x64 (${{ matrix.preset }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-default, ci-clang, ci-asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ clang \
            libeigen3-dev libyaml-cpp-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  arm64:
    name: arm64 (ci-default)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ \
            libeigen3-dev libyaml-cpp-dev
      - name: Configure
        run: cmake --preset ci-default
      - name: Build
        run: cmake --build --preset ci-default
      - name: Test
        run: ctest --preset ci-default
