services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: fusion-engine-dev
    working_dir: /work
    volumes:
      # Repository sources
      - .:/work
      # Optional dataset folder, mounted read-only. Defaults to ./data (gitignored).
      - ${FUSION_DATA_DIR:-./data}:/data:ro
      # Output folder for generated artifacts
      - ./out:/out
    stdin_open: true
    tty: true
    command: bash
